spring:
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/resume}
    username: ${DB_USER:resume}
    password: ${DB_PASSWORD:}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
  flyway:
    locations: classpath:db/migration
