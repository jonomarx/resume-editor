name: CI

on:
  push:
  pull_request:
  workflow_dispatch:
    inputs:
      postgres:
        description: Also run the Postgres profile (mvn verify -Ppostgres, Testcontainers)
        type: boolean
        default: true

permissions:
  contents: read

env:
  # frontend/package.json has no packageManager field, so pin pnpm here (US-078).
  PNPM_VERSION: '12.14.0'

jobs:
  backend-h2:
    name: Backend tests (H2)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - run: mvn -q test

  backend-postgres:
    name: Backend tests (Postgres profile, on demand)
    if: github.event_name == 'workflow_dispatch' && inputs.postgres
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - run: mvn -q verify -Ppostgres

  frontend:
    name: Frontend tests and build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Check for frontend/
        id: has
        run: |
          if [ -f frontend/package.json ]; then echo "present=true" >> "$GITHUB_OUTPUT"; else echo "present=false" >> "$GITHUB_OUTPUT"; echo "frontend/ not present yet; skipping"; fi
      - if: steps.has.outputs.present == 'true'
        uses: pnpm/action-setup@v5
        with:
          version: ${{ env.PNPM_VERSION }}
      - if: steps.has.outputs.present == 'true'
        uses: actions/setup-node@v5
        with:
          node-version: '24'
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml
      - if: steps.has.outputs.present == 'true'
        working-directory: frontend
        run: pnpm install --frozen-lockfile && pnpm lint && pnpm test && pnpm build

  api-contract:
    name: API contract lint and mock tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v5
        with:
          version: ${{ env.PNPM_VERSION }}
      - uses: actions/setup-node@v5
        with:
          node-version: '24'
          cache: pnpm
          cache-dependency-path: api-contract/pnpm-lock.yaml
      - working-directory: api-contract
        run: pnpm install --frozen-lockfile && pnpm test

  scripts:
    name: Script tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - run: scripts/tests/test-list-dummy.sh

  dummy-markers:
    name: List DUMMY markers on pull request
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@v5
      - name: Comment remaining markers
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ github.event.pull_request.number }}
        run: |
          {
            echo "<!-- dummy-markers -->"
            echo "### DUMMY markers"
            scripts/list-dummy.sh
          } > comment.md
          id=$(gh api "repos/${{ github.repository }}/issues/$PR/comments" --paginate \
                 --jq '[.[] | select(.body | startswith("<!-- dummy-markers -->"))][0].id // empty')
          if [ -n "$id" ]; then
            gh api -X PATCH "repos/${{ github.repository }}/issues/comments/$id" -F body=@comment.md >/dev/null
          else
            gh pr comment "$PR" --body-file comment.md
          fi
