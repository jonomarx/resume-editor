openapi: 3.0.3
info:
  title: Resume Editor API
  version: 0.7.0
  description: |
    Contract v0 (US-003, fixes in US-076 and US-097): auth, master resume, tags, render. Contract v1 (US-028, version
    0.6.0, additive): sources, ingest, jobs, drafts, cutdown. US-110 (0.7.0, additive): `GET /api/capabilities`; failed
    ingest events carry the code `llm_unavailable` when no LLM is configured (`LLM_PROVIDER=none`).
    Changed only through stories labeled `contract`.

    Conventions
    - All paths are under `/api`. JSON bodies use camelCase.
    - Authentication is a session cookie (`SESSION`, HttpOnly, SameSite=Lax) set by login or sign-up.
    - Every error response uses the `Error` schema.
    - Resume saves use optimistic locking: send the `baseVersion` you loaded; a stale save returns 409.

    CSRF protection
    - The server sets a JavaScript-readable `XSRF-TOKEN` cookie. `GET /api/me` always sets it, including its 401
      response, so a signed-out client can obtain a token before sign-up or login.
    - Every state-changing request (POST, PUT, DELETE, including sign-up, login and logout) must send the cookie's
      value in an `X-XSRF-TOKEN` header. A missing or wrong token returns 403 with code `csrf_invalid`.
    - The token may be replaced when a session starts; clients re-read the cookie before each request.
servers:
  - url: http://localhost:8080
    description: Local Spring Boot (the Vite dev server proxies /api to it)
tags:
  - name: auth
    description: Sign-up, login, logout, current user
  - name: resume
    description: Master resume read, write, versions, restore
  - name: tags
    description: Shared tag vocabulary
  - name: render
    description: LaTeX to PDF
  - name: sources
    description: Career page sources and their crawl health
  - name: ingest
    description: Ingest tokens and the ingest API (pasted or forwarded postings)
  - name: jobs
    description: The job feed, posting detail and the user's status per posting
  - name: drafts
    description: One tailored resume per posting
  - name: cutdown
    description: Cut a draft to exactly one page (proposals the user accepts or rejects)
security:
  - sessionCookie: []
paths:
  /api/auth/signup:
    post:
      tags: [auth]
      operationId: signUp
      summary: Create an account and start a session
      security: []
      parameters:
        - { $ref: '#/components/parameters/XsrfToken' }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/SignUpRequest' }
            example: { username: ada, password: correct-horse-battery }
      responses:
        '403': { $ref: '#/components/responses/CsrfInvalid' }
        '201':
          description: Account created and signed in
          headers:
            Set-Cookie:
              description: Session cookie
              schema: { type: string }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/User' }
              example: { id: 1, username: ada }
        '400':
          description: Request failed validation (username pattern, password shorter than 8 characters, longer than 72 UTF-8 bytes, or containing a control character)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
              examples:
                usernameInvalid:
                  value:
                    code: validation_failed
                    message: Request failed validation
                    details:
                      - { field: username, message: must be 3 to 40 characters }
                passwordTooLong:
                  summary: Password over 72 bytes in UTF-8 (rejected, not truncated)
                  value:
                    code: validation_failed
                    message: Request failed validation
                    details:
                      - { field: password, message: must be at most 72 bytes in UTF-8 }
                passwordControlCharacter:
                  summary: Password containing NUL or another control character (U+0000 to U+001F, U+007F)
                  value:
                    code: validation_failed
                    message: Request failed validation
                    details:
                      - { field: password, message: must not contain control characters }
        '409':
          description: Username already taken
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
              example: { code: username_taken, message: That username is taken }
  /api/auth/login:
    post:
      tags: [auth]
      operationId: logIn
      summary: Start a session
      security: []
      parameters:
        - { $ref: '#/components/parameters/XsrfToken' }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/Credentials' }
            example: { username: ada, password: correct-horse-battery }
      responses:
        '403': { $ref: '#/components/responses/CsrfInvalid' }
        '200':
          description: Signed in
          headers:
            Set-Cookie:
              description: Session cookie
              schema: { type: string }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/User' }
              example: { id: 1, username: ada }
        '400': { $ref: '#/components/responses/ValidationError' }
        '401':
          description: Wrong username or password. A password longer than 72 bytes is just a wrong password (same response, never a 400 and never truncated).
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
              example: { code: bad_credentials, message: Invalid username or password }
  /api/auth/logout:
    post:
      tags: [auth]
      operationId: logOut
      summary: End the session
      parameters:
        - { $ref: '#/components/parameters/XsrfToken' }
      responses:
        '403': { $ref: '#/components/responses/CsrfInvalid' }
        '204': { description: Signed out }
        '401': { $ref: '#/components/responses/Unauthorized' }
  /api/me:
    get:
      tags: [auth]
      operationId: getMe
      summary: The signed-in user
      responses:
        '200':
          description: Current user
          headers:
            Set-Cookie:
              description: Refreshes the `XSRF-TOKEN` cookie (readable by JavaScript)
              schema: { type: string }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/User' }
              example: { id: 1, username: ada }
        '401':
          description: Not signed in (the response still sets the `XSRF-TOKEN` cookie)
          headers:
            Set-Cookie:
              description: Sets the `XSRF-TOKEN` cookie (readable by JavaScript)
              schema: { type: string }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
              example: { code: unauthorized, message: Sign in required }
  /api/capabilities:
    get:
      tags: [auth]
      operationId: getCapabilities
      summary: Which optional features this server has
      description: |
        Lets the UI hide or disable features that cannot work. `llmAvailable` is false while no LLM provider is
        configured (`LLM_PROVIDER=none`, the default): then `llm_tighten` cutdown returns 503 `llm_unavailable` and pasted
        free text cannot be read (the ingest event fails with the code `llm_unavailable`). Ingesting a URL or HTML that
        carries structured posting data still works.
      responses:
        '200':
          description: The capabilities
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Capabilities' }
              example: { llmAvailable: false }
        '401': { $ref: '#/components/responses/Unauthorized' }
  /api/resumes/master:
    get:
      tags: [resume]
      operationId: getMasterResume
      summary: Read the latest version of the master resume
      description: The first read creates the master from the Jake-template starter tree.
      responses:
        '200':
          description: Latest version
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ResumeDocument' }
              examples:
                current: { $ref: '#/components/examples/ResumeDocument' }
        '401': { $ref: '#/components/responses/Unauthorized' }
    put:
      tags: [resume]
      operationId: saveMasterResume
      summary: Save a new version of the master resume
      description: |
        Succeeds only if `baseVersion` equals the current version; the new version is `baseVersion + 1`.
        A stale `baseVersion` returns 409 with the current version so the UI can offer a reload.

        A save whose tree is identical to the current version (same `contentHash`) does not create a version: it
        returns the current document unchanged with 200.

        Tags on nodes must be slugs in the tag vocabulary. A tree containing any unknown slug is rejected with 400,
        code `validation_failed`, and `details` has one entry per offending slug (`field` is the slug's node id
        path, `message` names the slug).

        Node LaTeX follows the `{{children}}` rules in the `ResumeNode` schema: a node with children but no token,
        or any other `{{...}}` token, is rejected with 400 `validation_failed` and `details` naming the node id.
      parameters:
        - { $ref: '#/components/parameters/XsrfToken' }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/SaveResumeRequest' }
            examples:
              save: { $ref: '#/components/examples/SaveRequest' }
      responses:
        '403': { $ref: '#/components/responses/CsrfInvalid' }
        '200':
          description: Saved
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ResumeDocument' }
              examples:
                current: { $ref: '#/components/examples/ResumeDocument' }
        '400':
          description: Request failed validation, including tags that are not in the vocabulary
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
              examples:
                unknownTag:
                  summary: A tag slug that is not in the vocabulary
                  value:
                    code: validation_failed
                    message: Request failed validation
                    details:
                      - { field: n-exp-1-b1, message: unknown tag slug "javscript" }
                missingChildrenToken:
                  summary: A node with children whose latex has no {{children}} token
                  value:
                    code: validation_failed
                    message: Request failed validation
                    details:
                      - { field: n-exp-1, message: 'node has children but its latex has no {{children}} token' }
                duplicateChildrenToken:
                  summary: More than one {{children}} token in one node
                  value:
                    code: validation_failed
                    message: Request failed validation
                    details:
                      - { field: n-exp, message: 'node latex has more than one {{children}} token' }
                unknownToken:
                  summary: A {{...}} token other than {{children}}
                  value:
                    code: validation_failed
                    message: Request failed validation
                    details:
                      - { field: n-exp, message: 'unknown token {{items}} (the only token is {{children}})' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '409': { $ref: '#/components/responses/VersionConflict' }
  /api/resumes/master/versions:
    get:
      tags: [resume]
      operationId: listMasterVersions
      summary: Version history, newest first
      responses:
        '200':
          description: Versions
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/ResumeVersionSummary' }
              example:
                - { version: 3, contentHash: e99551fa57d7a6c2858733580847871fae001b49e0f54e59dc8e15ebae6b5203, createdAt: '2026-10-18T20:15:00Z' }
                - { version: 2, contentHash: b10af658e08210683091e16185d3c41ddcae75ca55322e125094137dd668097e, createdAt: '2026-10-18T19:02:00Z' }
        '401': { $ref: '#/components/responses/Unauthorized' }
  /api/resumes/master/versions/{version}:
    get:
      tags: [resume]
      operationId: getMasterVersion
      summary: Read one historical version
      parameters:
        - { $ref: '#/components/parameters/Version' }
      responses:
        '200':
          description: That version
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ResumeDocument' }
              examples:
                current: { $ref: '#/components/examples/ResumeDocument' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
  /api/resumes/master/versions/{version}/restore:
    post:
      tags: [resume]
      operationId: restoreMasterVersion
      summary: Make an old version the newest version
      description: |
        Copies the old content into a new version (history is never rewritten).
        Uses the same optimistic check as a save.
        A missing or invalid `baseVersion` returns 400.
        If the stored tree of that version violates today's node rules (for example the `{{children}}` rules of the
        `ResumeNode` schema), restore is rejected with the same 400 `validation_failed` as a save. No such stored data
        exists yet.
      parameters:
        - { $ref: '#/components/parameters/XsrfToken' }
        - { $ref: '#/components/parameters/Version' }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/RestoreRequest' }
            example: { baseVersion: 3 }
      responses:
        '403': { $ref: '#/components/responses/CsrfInvalid' }
        '200':
          description: Restored as a new version
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ResumeDocument' }
              examples:
                current: { $ref: '#/components/examples/ResumeDocument' }
        '400': { $ref: '#/components/responses/ValidationError' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/VersionConflict' }
  /api/tags:
    get:
      tags: [tags]
      operationId: listTags
      summary: The tag vocabulary
      parameters:
        - name: category
          in: query
          schema: { $ref: '#/components/schemas/TagCategory' }
        - name: q
          in: query
          description: Case-insensitive substring match on name, slug or alias key (the lower-cased trimmed alias)
          schema: { type: string }
      responses:
        '200':
          description: Tags
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/Tag' }
              example:
                - { id: 7, name: Java, slug: java, category: language, aliases: [Java 17, JDK] }
                - { id: 8, name: React, slug: react, category: framework, aliases: [React.js] }
                - { id: 10, name: C++, slug: c-plus-plus, category: language, aliases: [CPP, 'C++'] }
        '401': { $ref: '#/components/responses/Unauthorized' }
    post:
      tags: [tags]
      operationId: createTag
      summary: Get or create a vocabulary entry
      description: |
        Slug normalization, in this order: trim, Unicode NFKC, lowercase, replace every `+` with `-plus-` and every `#`
        with `-sharp-`, collapse every run of characters outside `[a-z0-9]` into one hyphen, strip leading and trailing
        hyphens. So "C" is `c`, "C++" is `c-plus-plus`, "C#" is `c-sharp`, "Node.js" is `node-js`. Non-ASCII letters are
        not transliterated: they are separators ("café" gives `caf`). A name with no letter or digit and no `+` or `#`
        is rejected with 400 `validation_failed`.

        Resolution order: (1) the trimmed, lower-cased name is compared with every alias key of the user (an alias key
        is the trimmed, lower-cased alias); (2) the computed slug is compared with the user's tag slugs and with their
        alias keys. The first match is returned with 200 (its category and name are kept); if nothing matches a new tag
        is created with 201. Example: posting "C++" returns the tag that has the alias "C++" if there is one, otherwise
        creates `c-plus-plus`.
      parameters:
        - { $ref: '#/components/parameters/XsrfToken' }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CreateTagRequest' }
            examples:
              postgres: { value: { name: PostgreSQL, category: language } }
              cpp: { value: { name: 'C++', category: language } }
              csharp: { value: { name: 'C#', category: language } }
      responses:
        '403': { $ref: '#/components/responses/CsrfInvalid' }
        '200':
          description: Already existed (the name matched an alias key, a slug or a slug equal to an alias key)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Tag' }
              examples:
                postgres: { value: { id: 9, name: PostgreSQL, slug: postgresql, category: language, aliases: [Postgres] } }
                cpp: { value: { id: 10, name: C++, slug: c-plus-plus, category: language, aliases: ['C++', CPP] } }
        '201':
          description: Created
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Tag' }
              examples:
                postgres: { value: { id: 9, name: PostgreSQL, slug: postgresql, category: language, aliases: [] } }
                cpp: { value: { id: 10, name: C++, slug: c-plus-plus, category: language, aliases: [] } }
                csharp: { value: { id: 11, name: C#, slug: c-sharp, category: language, aliases: [] } }
        '400': { $ref: '#/components/responses/ValidationError' }
        '401': { $ref: '#/components/responses/Unauthorized' }
  /api/tags/{slug}/aliases:
    post:
      tags: [tags]
      operationId: addTagAlias
      summary: Add an alias to a tag
      description: |
        An alias is any printable ASCII text (0x20 to 0x7E): "C++", "C#", ".NET" and "Node.js" are valid aliases. After
        trimming leading and trailing spaces it must be 1 to 60 characters; anything else (control characters, non-ASCII
        characters such as "café", an empty value) is rejected with 400 `validation_failed`. The alias is stored exactly
        as typed after trimming (leading and trailing spaces are removed when it is stored; internal spaces and case are
        kept) and shown that way in `Tag.aliases`.

        Comparison uses the alias key: the trimmed alias lower-cased. Aliases are unique per user by alias key, so "C++"
        and "c++" are the same alias. An alias is a conflict when its key equals another tag's alias key or another tag's
        slug; that is rejected with 409 `alias_conflict`. Clients must not parse the free-text `message`; use
        `conflictingSlug`.

        Adding an alias whose key equals one the tag already has, or equals the tag's own slug, is a no-op: 200 with the
        unchanged canonical Tag. The canonical slug never changes through these operations. There is no cap on the
        number of aliases per tag.

        Afterwards `POST /api/tags` and `GET /api/tags?q=` resolve the alias to this tag (200, existing).

        Adding or removing an alias never changes the tags on any resume node (nodes reference tags by slug).
      parameters:
        - { $ref: '#/components/parameters/XsrfToken' }
        - { $ref: '#/components/parameters/TagSlug' }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/AddAliasRequest' }
            examples:
              plain: { value: { alias: Postgres } }
              cpp: { value: { alias: 'C++' } }
              dotnet: { value: { alias: .NET } }
      responses:
        '200':
          description: The updated tag
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Tag' }
              examples:
                plain: { value: { id: 9, name: PostgreSQL, slug: postgresql, category: language, aliases: [Postgres] } }
                cpp: { value: { id: 10, name: C++, slug: c-plus-plus, category: language, aliases: ['C++'] } }
        '400':
          description: The alias is empty, longer than 60 characters, or not printable ASCII
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
              examples:
                nonAscii:
                  summary: Non-ASCII character
                  value:
                    code: validation_failed
                    message: Request failed validation
                    details:
                      - { field: alias, message: must be printable ASCII (space to tilde) }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/CsrfInvalid' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409':
          description: The alias key equals another tag's alias key or slug
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AliasConflictError' }
              examples:
                conflict:
                  summary: Case-insensitive collision ("MYSQL" or "mysql" against tag mysql)
                  value: { code: alias_conflict, message: That alias already belongs to another tag, conflictingSlug: mysql }
                aliasEqualsOtherSlug:
                  summary: Adding the alias "C" to tag c-plus-plus (its alias key `c` equals the slug of tag c)
                  value: { code: alias_conflict, message: That alias already belongs to another tag, conflictingSlug: c }
    delete:
      tags: [tags]
      operationId: removeTagAlias
      summary: Remove an alias from a tag
      description: |
        The alias goes in the `alias` query parameter, percent-encoded (aliases can contain `/`, `.`, `%`, `#` and
        spaces, which do not belong in a path segment: "C++" is `?alias=C%2B%2B`). It is matched by alias key, so the
        case of the value does not matter. Removing an alias the tag does not have returns 404, as does an unknown tag
        or a `{slug}` that is not a valid slug. The tag's slug itself is not an alias and cannot be removed here. The
        canonical slug never changes through this operation, and removing an alias never changes the tags on any
        resume node.

        Encoding: a space in the `alias` value is `%20` (not `+`), and a literal `+` is `%2B`. An alias that is too
        long or not printable ASCII can never be stored, so it simply matches nothing and returns 404.
      parameters:
        - { $ref: '#/components/parameters/XsrfToken' }
        - { $ref: '#/components/parameters/TagSlug' }
        - name: alias
          in: query
          required: true
          description: The alias to remove, percent-encoded; matched by alias key (trimmed, lower-cased).
          schema: { type: string }
          example: C++
      responses:
        '200':
          description: The updated tag
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Tag' }
              example: { id: 10, name: C++, slug: c-plus-plus, category: language, aliases: [] }
        '400':
          description: The `alias` query parameter is missing
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
              example:
                code: validation_failed
                message: Request failed validation
                details:
                  - { field: alias, message: is required }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/CsrfInvalid' }
        '404': { $ref: '#/components/responses/NotFound' }
  /api/render:
    post:
      tags: [render]
      operationId: renderResume
      summary: Compile a resume tree to PDF
      description: |
        The server assembles the tree into a LaTeX document (locked preamble, header, sections, footer),
        compiles it in the sandboxed renderer, and caches the result by content hash. The same tree always
        returns the same `contentHash`. A LaTeX compile failure is a normal 200 response with `success: false`
        and errors mapped to node ids; fetch the PDF of a successful render from `pdfUrl`.
      parameters:
        - { $ref: '#/components/parameters/XsrfToken' }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/RenderRequest' }
            examples:
              render: { $ref: '#/components/examples/RenderRequest' }
      responses:
        '403': { $ref: '#/components/responses/CsrfInvalid' }
        '200':
          description: Render finished (check `success`)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/RenderResult' }
              examples:
                ok:
                  summary: Compiled
                  value:
                    success: true
                    contentHash: b706a01cf5720a0f5e9044150a32728b0773bfd2a065bfa7704fb9ae91038f82
                    cached: false
                    pageCount: 1
                    pdfUrl: /api/render/b706a01cf5720a0f5e9044150a32728b0773bfd2a065bfa7704fb9ae91038f82/pdf
                    log: This is pdfTeX, Version 3.141592653
                    errors: []
                failed:
                  summary: Compile error in a node
                  value:
                    success: false
                    contentHash: b6630edd4acc65e3c44874f48d0f80e3fe629905b7aad7ca669f149162451d63
                    cached: false
                    pageCount: null
                    pdfUrl: null
                    log: '! Undefined control sequence.'
                    errors:
                      - { nodeId: n-exp-1, line: 2, message: Undefined control sequence }
        '400': { $ref: '#/components/responses/ValidationError' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '413':
          description: Document too large
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
              example: { code: too_large, message: Resume is too large to render }
        '429':
          description: Too many render requests
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
              example: { code: rate_limited, message: Slow down and try again shortly }
        '503':
          description: Renderer unavailable or timed out
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
              example: { code: renderer_unavailable, message: The renderer did not respond in time }
  /api/render/{contentHash}/pdf:
    get:
      tags: [render]
      operationId: getRenderedPdf
      summary: The PDF of a successful render
      description: |
        `contentHash` is the full SHA-256 (64 hex characters) from a render result. The server checks that the PDF
        belongs to the signed-in user; any other hash, including someone else's, returns 404 (never 403).
      parameters:
        - name: contentHash
          in: path
          required: true
          schema: { type: string, pattern: '^[0-9a-f]{64}$' }
          example: b706a01cf5720a0f5e9044150a32728b0773bfd2a065bfa7704fb9ae91038f82
      responses:
        '200':
          description: PDF bytes (immutable, cacheable)
          content:
            application/pdf:
              schema: { type: string, format: binary }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
  /api/sources:
    get:
      tags: [sources]
      operationId: listSources
      summary: The user's career page sources
      responses:
        '200':
          description: Sources, oldest first
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/Source' }
              example:
                - { id: 3, name: Acme Careers, url: 'https://acme.example/careers', enabled: true, extractionTier: json_ld, createdAt: '2026-10-19T10:00:00Z', lastCrawlAt: '2026-10-20T06:00:00Z' }
        '401': { $ref: '#/components/responses/Unauthorized' }
    post:
      tags: [sources]
      operationId: createSource
      summary: Add a career page
      description: |
        The URL must be absolute `http` or `https`. It is normalized and a source whose normalized URL the user already
        has is rejected with 409 `source_exists`. Normalization (the same function the posting normalizer uses for
        posting URLs, so Frontend can predict duplicates): lower-case the scheme and host; drop a default port (80 for
        `http`, 443 for `https`); drop the fragment; drop the query parameters `utm_*`, `gclid`, `fbclid`, `mc_cid`,
        `mc_eid`, `ref` and `ref_src`; sort the remaining query parameters by name; make an empty path `/` and remove a
        trailing `/` from any other path; upper-case percent-encoding hex digits. Nothing else is rewritten (no `www.`
        stripping, no `http` to `https` upgrade).

        Only public targets are fetched (SSRF protection): the host must resolve to public addresses only. `localhost`,
        loopback, link-local (including the cloud metadata address 169.254.169.254), private (RFC 1918, unique local),
        carrier-grade NAT and other non-routable ranges are refused, for every address a name resolves to, and every
        redirect target is checked again the same way (redirects are limited to 5 hops, `http` and `https` only).
        A URL that is obviously not allowed (a literal IP address or `localhost` in a refused range) is rejected at once
        with 400 `validation_failed` on `url`. A name that only resolves to a refused address is detected when it is
        fetched: the crawl run fails (`CrawlRun.status` `failed`, `error` `url_not_allowed`).

        The source is crawled by the next daily run; creating it does not fetch anything.
      parameters:
        - { $ref: '#/components/parameters/XsrfToken' }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CreateSourceRequest' }
            example: { url: 'https://acme.example/careers', name: Acme Careers }
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Source' }
              example: { id: 3, name: Acme Careers, url: 'https://acme.example/careers', enabled: true, extractionTier: null, createdAt: '2026-10-19T10:00:00Z', lastCrawlAt: null }
        '400': { $ref: '#/components/responses/ValidationError' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/CsrfInvalid' }
        '409':
          description: The user already has this source
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SourceExistsError' }
              example: { code: source_exists, message: You already added this career page, existingSourceId: 3 }
  /api/sources/{sourceId}:
    get:
      tags: [sources]
      operationId: getSource
      summary: One source
      parameters:
        - { $ref: '#/components/parameters/SourceId' }
      responses:
        '200':
          description: The source
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Source' }
              example: { id: 3, name: Acme Careers, url: 'https://acme.example/careers', enabled: true, extractionTier: json_ld, createdAt: '2026-10-19T10:00:00Z', lastCrawlAt: '2026-10-20T06:00:00Z' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
    put:
      tags: [sources]
      operationId: updateSource
      summary: Rename or enable or disable a source
      description: A disabled source is skipped by the daily crawl; its postings are still validity-checked. The URL cannot be changed (delete and add instead).
      parameters:
        - { $ref: '#/components/parameters/XsrfToken' }
        - { $ref: '#/components/parameters/SourceId' }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/UpdateSourceRequest' }
            example: { name: Acme (summer), enabled: false }
      responses:
        '200':
          description: The updated source
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Source' }
              example: { id: 3, name: Acme (summer), url: 'https://acme.example/careers', enabled: false, extractionTier: json_ld, createdAt: '2026-10-19T10:00:00Z', lastCrawlAt: '2026-10-20T06:00:00Z' }
        '400': { $ref: '#/components/responses/ValidationError' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/CsrfInvalid' }
        '404': { $ref: '#/components/responses/NotFound' }
    delete:
      tags: [sources]
      operationId: deleteSource
      summary: Remove a source
      description: |
        Removes the source and its crawl history. Postings it produced stay in the feed (they are validity-checked like
        any posting) but no longer belong to a source (`sourceId` becomes null).
      parameters:
        - { $ref: '#/components/parameters/XsrfToken' }
        - { $ref: '#/components/parameters/SourceId' }
      responses:
        '204': { description: Removed }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/CsrfInvalid' }
        '404': { $ref: '#/components/responses/NotFound' }
  /api/source-health:
    get:
      tags: [sources]
      operationId: getSourceHealth
      summary: Health of every source (last run and recent history)
      responses:
        '200':
          description: One entry per source
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/SourceHealth' }
              example:
                - source: { id: 3, name: Acme Careers, url: 'https://acme.example/careers', enabled: true, extractionTier: json_ld, createdAt: '2026-10-19T10:00:00Z', lastCrawlAt: '2026-10-20T06:00:00Z' }
                  state: healthy
                  consecutiveFailures: 0
                  activePostings: 12
                  stalePostings: 1
                  lastRun: { id: 41, startedAt: '2026-10-20T06:00:00Z', finishedAt: '2026-10-20T06:00:09Z', status: succeeded, postingsSeen: 13, added: 2, updated: 1, closed: 0, error: null }
                  recentRuns:
                    - { id: 41, startedAt: '2026-10-20T06:00:00Z', finishedAt: '2026-10-20T06:00:09Z', status: succeeded, postingsSeen: 13, added: 2, updated: 1, closed: 0, error: null }
        '401': { $ref: '#/components/responses/Unauthorized' }
  /api/ingest/tokens:
    get:
      tags: [ingest]
      operationId: listIngestTokens
      summary: The user's ingest tokens (never the secret)
      responses:
        '200':
          description: Tokens, newest first, including revoked ones
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/IngestToken' }
              example:
                - { id: 5, label: Bookmarklet, createdAt: '2026-10-19T10:00:00Z', lastUsedAt: '2026-10-20T07:30:00Z', revokedAt: null }
        '401': { $ref: '#/components/responses/Unauthorized' }
    post:
      tags: [ingest]
      operationId: createIngestToken
      summary: Create an ingest-only token
      description: |
        The secret is returned once, in `token`, and never again; only a hash is stored. The token can call
        `POST /api/ingest` and the ingest event reads, nothing else: on any other route a bearer token is 401. Tokens
        can only be created, listed and revoked with a session. A bookmarklet runs inside the job page, so that page's
        scripts can read the token; that is why it is ingest-only and revocable.
      parameters:
        - { $ref: '#/components/parameters/XsrfToken' }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CreateIngestTokenRequest' }
            example: { label: Bookmarklet }
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CreatedIngestToken' }
              example: { id: 5, label: Bookmarklet, createdAt: '2026-10-19T10:00:00Z', lastUsedAt: null, revokedAt: null, token: ing_3f6c0b528a1d4c579e2b5d1a7c4e9f10 }
        '400': { $ref: '#/components/responses/ValidationError' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/CsrfInvalid' }
  /api/ingest/tokens/{tokenId}:
    delete:
      tags: [ingest]
      operationId: revokeIngestToken
      summary: Revoke a token
      description: Takes effect immediately. Revoking an already revoked token is a no-op (204).
      parameters:
        - { $ref: '#/components/parameters/XsrfToken' }
        - name: tokenId
          in: path
          required: true
          schema: { type: integer, format: int64 }
          example: 5
      responses:
        '204': { description: Revoked }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/CsrfInvalid' }
        '404': { $ref: '#/components/responses/NotFound' }
  /api/ingest:
    options:
      tags: [ingest]
      operationId: ingestPreflight
      summary: CORS preflight for the ingest bookmarklet
      description: |
        Answers the browser's preflight for `POST /api/ingest` without authentication and without CSRF: 204 with
        `Access-Control-Allow-Origin: *`, `Access-Control-Allow-Methods: POST, OPTIONS`,
        `Access-Control-Allow-Headers: Authorization, Content-Type` and `Access-Control-Max-Age: 600`; never
        `Access-Control-Allow-Credentials`. No other path answers a preflight.
      security: []
      responses:
        '204':
          description: Preflight allowed
          headers:
            Access-Control-Allow-Origin: { schema: { type: string, enum: ['*'] } }
            Access-Control-Allow-Methods: { schema: { type: string } }
            Access-Control-Allow-Headers: { schema: { type: string } }
            Access-Control-Max-Age: { schema: { type: integer } }
    post:
      tags: [ingest]
      operationId: ingestPosting
      summary: Hand the server a posting to process later
      description: |
        Authentication: a signed-in session (with the CSRF header like any state-changing call) or an ingest token sent
        as `Authorization: Bearer <token>`.

        - If a request has an `Authorization: Bearer` header, the bearer token is the only credential: any `SESSION`
          cookie is ignored (never used as a fallback), the CSRF header is not required, and the request is handled as
          a bearer request below even if the cookie is valid. Without the header, the session rules apply.
        - A bearer request is answered with CORS headers (`Access-Control-Allow-Origin: *`, never
          `Access-Control-Allow-Credentials`) so the bookmarklet can post from the job page's origin. This is the only
          CORS exception in the API: session requests are never CORS-enabled (no CORS headers, preflight not answered
          with an allowance), and no other route allows bearer tokens or cross-origin calls.
        - The browser's preflight is `OPTIONS /api/ingest` (no credentials, no authentication needed); see that
          operation.
        - An unknown, malformed or revoked token is 401 `unauthorized`, with the same body as a missing credential, so
          a response never tells which case it was. The 401 carries the same CORS headers.

        For `kind: url` only public targets are fetched (SSRF protection): the host must resolve to public addresses only. `localhost`,
        loopback, link-local (including the cloud metadata address 169.254.169.254), private (RFC 1918, unique local),
        carrier-grade NAT and other non-routable ranges are refused, for every address a name resolves to, and every
        redirect target is checked again the same way (redirects are limited to 5 hops, `http` and `https` only).
        A URL that is obviously not allowed (a literal IP address or `localhost` in a refused range) is rejected at once
        with 400 `validation_failed` on `payload`; a name that only resolves to a refused address is detected when the
        event is processed: the event is `failed` with error code `url_not_allowed`.

        `kind` says what `payload` is: `url` (a posting URL to fetch), `html` (the page source), `text` (pasted
        text) or `email` (a forwarded email body). `sourceHint` is optional free text that helps extraction, typically
        the page URL or the company name for `html` and `text`. Posting text is untrusted data: it is never executed
        and never used as instructions.

        The server answers 202 at once and processes asynchronously; follow progress with
        `GET /api/ingest/events/{id}`. The call is idempotent: the same URL (after normalization) or the same content
        hash for the same user returns 202 with the existing event's id and `duplicate: true`, and creates nothing new.
      security:
        - sessionCookie: []
        - ingestToken: []
      parameters:
        - name: X-XSRF-TOKEN
          in: header
          required: false
          description: Required with a session cookie; not used with a bearer token.
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/IngestRequest' }
            examples:
              url: { value: { kind: url, payload: 'https://acme.example/careers/swe-intern', sourceHint: null } }
              text: { value: { kind: text, payload: 'Software Engineering Intern, Acme. Seattle. Summer 2027 ...', sourceHint: 'https://acme.example/careers/swe-intern' } }
      responses:
        '202':
          description: Accepted for processing
          content:
            application/json:
              schema: { $ref: '#/components/schemas/IngestAccepted' }
              examples:
                new: { value: { ingestEventId: 88, status: queued, duplicate: false } }
                duplicate: { value: { ingestEventId: 88, status: done, duplicate: true } }
        '400': { $ref: '#/components/responses/ValidationError' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/CsrfInvalid' }
        '413':
          description: Payload too large
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
              example: { code: too_large, message: The posting is too large }
        '429':
          description: Too many ingest requests
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
              example: { code: rate_limited, message: Slow down and try again shortly }
  /api/ingest/events:
    get:
      tags: [ingest]
      operationId: listIngestEvents
      summary: Recent ingest events, newest first
      security:
        - sessionCookie: []
        - ingestToken: []
      parameters:
        - name: limit
          in: query
          schema: { type: integer, minimum: 1, maximum: 100, default: 20 }
      responses:
        '200':
          description: Events
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/IngestEvent' }
              example:
                - { id: 88, kind: text, status: done, receivedAt: '2026-10-20T07:30:00Z', finishedAt: '2026-10-20T07:30:04Z', jobId: 140, error: null }
        '401': { $ref: '#/components/responses/Unauthorized' }
  /api/ingest/events/{eventId}:
    get:
      tags: [ingest]
      operationId: getIngestEvent
      summary: One ingest event (poll it until `status` is final)
      description: Another user's event, or an unknown id, is 404.
      security:
        - sessionCookie: []
        - ingestToken: []
      parameters:
        - name: eventId
          in: path
          required: true
          schema: { type: integer, format: int64 }
          example: 88
      responses:
        '200':
          description: The event
          content:
            application/json:
              schema: { $ref: '#/components/schemas/IngestEvent' }
              examples:
                done: { value: { id: 88, kind: text, status: done, receivedAt: '2026-10-20T07:30:00Z', finishedAt: '2026-10-20T07:30:04Z', jobId: 140, error: null } }
                failed: { value: { id: 89, kind: url, status: failed, receivedAt: '2026-10-20T07:31:00Z', finishedAt: '2026-10-20T07:31:02Z', jobId: null, error: { code: fetch_failed, message: The page could not be fetched } } }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
  /api/jobs:
    get:
      tags: [jobs]
      operationId: listJobs
      summary: The job feed
      description: |
        Postings visible to the user, scored against the master resume on each request. Closed postings are hidden
        unless a draft references them. Sort `fit` is highest score first, `newest` is most recently first seen; ties
        break by id, so a page is stable.
      parameters:
        - name: sort
          in: query
          schema: { type: string, enum: [fit, newest], default: fit }
        - name: tag
          in: query
          description: Tag slug; repeat for several. A posting must carry every given tag.
          style: form
          explode: true
          schema: { type: array, items: { type: string } }
        - name: location
          in: query
          description: Case-insensitive substring match on the location
          schema: { type: string }
        - name: status
          in: query
          description: The user's own status for the posting
          schema: { $ref: '#/components/schemas/JobUserStatus' }
        - name: maxAgeDays
          in: query
          description: Only postings first seen within this many days
          schema: { type: integer, minimum: 1 }
        - name: q
          in: query
          description: Full-text search over title, company and description
          schema: { type: string }
        - name: limit
          in: query
          schema: { type: integer, minimum: 1, maximum: 100, default: 50 }
        - name: offset
          in: query
          schema: { type: integer, minimum: 0, default: 0 }
      responses:
        '200':
          description: One page of the feed
          content:
            application/json:
              schema: { $ref: '#/components/schemas/JobPage' }
              examples:
                page: { $ref: '#/components/examples/JobPage' }
        '400': { $ref: '#/components/responses/ValidationError' }
        '401': { $ref: '#/components/responses/Unauthorized' }
  /api/jobs/{jobId}:
    get:
      tags: [jobs]
      operationId: getJob
      summary: One posting in full, with its fit explanation
      parameters:
        - { $ref: '#/components/parameters/JobId' }
      responses:
        '200':
          description: The posting
          content:
            application/json:
              schema: { $ref: '#/components/schemas/JobDetail' }
              examples:
                detail: { $ref: '#/components/examples/JobDetail' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
  /api/jobs/{jobId}/status:
    put:
      tags: [jobs]
      operationId: setJobStatus
      summary: Save, dismiss or mark a posting applied
      description: Sets the user's own status; it never changes the posting. Setting the current value is a no-op.
      parameters:
        - { $ref: '#/components/parameters/XsrfToken' }
        - { $ref: '#/components/parameters/JobId' }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/SetJobStatusRequest' }
            example: { status: saved }
      responses:
        '200':
          description: The posting with its new status
          content:
            application/json:
              schema: { $ref: '#/components/schemas/JobSummary' }
              examples:
                saved: { $ref: '#/components/examples/JobSummary' }
        '400': { $ref: '#/components/responses/ValidationError' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/CsrfInvalid' }
        '404': { $ref: '#/components/responses/NotFound' }
  /api/jobs/{jobId}/drafts:
    post:
      tags: [drafts]
      operationId: createDraft
      summary: Open the draft for a posting, forking the master if there is none
      description: |
        There is at most one draft per posting and user. If none exists the current master is copied into a new draft
        (201); if one exists it is returned unchanged (200). A draft never pulls changes from the master afterwards.
      parameters:
        - { $ref: '#/components/parameters/XsrfToken' }
        - { $ref: '#/components/parameters/JobId' }
      responses:
        '200':
          description: The existing draft
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Draft' }
              examples:
                current: { $ref: '#/components/examples/Draft' }
        '201':
          description: A new draft forked from the master
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Draft' }
              examples:
                current: { $ref: '#/components/examples/Draft' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/CsrfInvalid' }
        '404': { $ref: '#/components/responses/NotFound' }
  /api/drafts:
    get:
      tags: [drafts]
      operationId: listDrafts
      summary: The user's drafts, most recently updated first
      parameters:
        - name: status
          in: query
          schema: { $ref: '#/components/schemas/DraftStatus' }
      responses:
        '200':
          description: Drafts
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/DraftSummary' }
              example:
                - { id: 21, jobId: 140, jobTitle: Software Engineering Intern, company: Acme, status: in_progress, version: 3, updatedAt: '2026-10-20T08:00:00Z' }
        '401': { $ref: '#/components/responses/Unauthorized' }
  /api/drafts/{draftId}:
    get:
      tags: [drafts]
      operationId: getDraft
      summary: Read the latest version of a draft
      parameters:
        - { $ref: '#/components/parameters/DraftId' }
      responses:
        '200':
          description: The draft
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Draft' }
              examples:
                current: { $ref: '#/components/examples/Draft' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
    put:
      tags: [drafts]
      operationId: saveDraft
      summary: Save a new version of a draft
      description: |
        Same rules as saving the master (`PUT /api/resumes/master`): optimistic check on `baseVersion` (a stale one is
        409 with the current version), a save identical to the current content does not create a version (200,
        unchanged), the same tag and `{{children}}` validation with 400 `validation_failed`.

        `excludedNodeIds` are the include toggles: the listed nodes, and their children, are left out of the rendered and
        exported document but stay in the tree, so a toggle can be switched back. Every id must exist in the tree (400
        otherwise). Header and footer cannot be excluded. `status` is optional and unchanged when omitted; the status
        is not part of the content hash.

        Rendering with exclusions: `POST /api/render` is unchanged and takes only a tree, so a client that previews a
        draft (live render, page meter) first prunes the tree itself: remove every node listed in `excludedNodeIds`
        together with its whole subtree, and send the pruned tree. The server applies exactly the same rule to
        `exportDraft` and to cutdown runs, so a client-pruned render and the export of the same draft are the same
        document and the same page count.
      parameters:
        - { $ref: '#/components/parameters/XsrfToken' }
        - { $ref: '#/components/parameters/DraftId' }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/SaveDraftRequest' }
            examples:
              save: { $ref: '#/components/examples/SaveDraftRequest' }
      responses:
        '200':
          description: Saved
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Draft' }
              examples:
                current: { $ref: '#/components/examples/Draft' }
        '400': { $ref: '#/components/responses/ValidationError' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/CsrfInvalid' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/VersionConflict' }
  /api/drafts/{draftId}/export:
    get:
      tags: [drafts]
      operationId: exportDraft
      summary: Export the draft as a PDF or as LaTeX source
      description: |
        Exports the draft's latest version with the include toggles applied. `pdf` compiles it (or serves the cached
        render) and answers 503 `renderer_unavailable` when the renderer is down, or 422 `compile_failed` when the
        document does not compile. `tex` is the assembled document including the locked preamble, as `text/x-tex`.
        Both are sent as attachments.
      parameters:
        - { $ref: '#/components/parameters/DraftId' }
        - name: format
          in: query
          required: true
          schema: { type: string, enum: [pdf, tex] }
          example: pdf
      responses:
        '200':
          description: The file
          headers:
            Content-Disposition:
              description: attachment with a file name derived from the posting
              schema: { type: string }
          content:
            application/pdf:
              schema: { type: string, format: binary }
            text/x-tex:
              schema: { type: string }
              example: '\documentclass[letterpaper,11pt]{article} ...'
        '400': { $ref: '#/components/responses/ValidationError' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        '422':
          description: The draft does not compile (`format=pdf` only)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
              example: { code: compile_failed, message: The draft did not compile }
        '503':
          description: Renderer unavailable or timed out
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
              example: { code: renderer_unavailable, message: The renderer did not respond in time }
  /api/drafts/{draftId}/versions:
    get:
      tags: [drafts]
      operationId: listDraftVersions
      summary: Version history of a draft, newest first
      parameters:
        - { $ref: '#/components/parameters/DraftId' }
      responses:
        '200':
          description: Versions
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/DraftVersionSummary' }
              example:
                - { version: 3, contentHash: e99551fa57d7a6c2858733580847871fae001b49e0f54e59dc8e15ebae6b5203, createdAt: '2026-10-20T08:00:00Z', reason: cutdown_applied }
                - { version: 2, contentHash: b10af658e08210683091e16185d3c41ddcae75ca55322e125094137dd668097e, createdAt: '2026-10-20T07:59:00Z', reason: before_cutdown }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
  /api/drafts/{draftId}/versions/{version}/restore:
    post:
      tags: [drafts]
      operationId: restoreDraftVersion
      summary: Make an old draft version the newest version
      description: Same behaviour as `restoreMasterVersion`, including the include toggles of that version. This is how a cutdown is undone.
      parameters:
        - { $ref: '#/components/parameters/XsrfToken' }
        - { $ref: '#/components/parameters/DraftId' }
        - { $ref: '#/components/parameters/Version' }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/RestoreRequest' }
            example: { baseVersion: 3 }
      responses:
        '200':
          description: Restored as a new version
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Draft' }
              examples:
                current: { $ref: '#/components/examples/Draft' }
        '400': { $ref: '#/components/responses/ValidationError' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/CsrfInvalid' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/VersionConflict' }
  /api/drafts/{draftId}/cutdowns:
    post:
      tags: [cutdown]
      operationId: startCutdown
      summary: Start a cutdown of the draft to exactly one page
      description: |
        Starts a run against the draft's version `baseVersion` (a stale one is 409 `version_conflict`) and answers 202
        with the run; the work (looping on the renderer, and the LLM in `llm_tighten` mode) happens asynchronously. Poll
        `GET /api/drafts/{draftId}/cutdowns/{runId}` until `status` is `ready` or `failed`.

        `deterministic` scores every node against the posting, keeps the highest-scoring nodes and loops on the
        renderer until the document is exactly one page; it can only exclude nodes, never invents text. `llm_tighten`
        may in addition propose rewordings of node LaTeX; it never adds claims (checked by the server). A run proposes;
        it changes nothing until `apply`.

        Only one run per draft is active at a time: starting another while one is `queued` or `running` is 409
        `cutdown_in_progress`. A run never blocks the draft forever: one still `queued` or `running` 10 minutes after
        it was created (a crash, a lost worker, a hung renderer or LLM) is marked `failed` with error code
        `timed_out` the next time it is read or a new run is started, after which a new run can start.
      parameters:
        - { $ref: '#/components/parameters/XsrfToken' }
        - { $ref: '#/components/parameters/DraftId' }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/StartCutdownRequest' }
            example: { baseVersion: 3, mode: deterministic }
      responses:
        '202':
          description: Accepted; the run is queued
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CutdownRun' }
              example: { id: 7, draftId: 21, baseVersion: 3, mode: deterministic, status: queued, createdAt: '2026-10-20T08:05:00Z', pageCountBefore: null, pageCountAfter: null, suggestions: [], error: null }
        '400': { $ref: '#/components/responses/ValidationError' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/CsrfInvalid' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409':
          description: Stale `baseVersion` (`version_conflict`, with `currentVersion`) or a run is already active (`cutdown_in_progress`)
          content:
            application/json:
              schema:
                anyOf:
                  - { $ref: '#/components/schemas/VersionConflictError' }
                  - { $ref: '#/components/schemas/Error' }
              examples:
                stale: { value: { code: version_conflict, message: The resume changed since you loaded it, currentVersion: 4 } }
                active: { value: { code: cutdown_in_progress, message: A cutdown is already running for this draft } }
        '429':
          description: The LLM budget is used up (`llm_tighten` only)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
              example: { code: llm_budget_exceeded, message: The AI budget for this period is used up }
        '503':
          description: No LLM is configured or it is unavailable (`llm_tighten` only)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
              example: { code: llm_unavailable, message: The AI service is not available }
  /api/drafts/{draftId}/cutdowns/{runId}:
    get:
      tags: [cutdown]
      operationId: getCutdown
      summary: A cutdown run with its per-node suggestions
      parameters:
        - { $ref: '#/components/parameters/DraftId' }
        - { $ref: '#/components/parameters/RunId' }
      responses:
        '200':
          description: The run
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CutdownRun' }
              examples:
                ready:
                  value:
                    id: 7
                    draftId: 21
                    baseVersion: 3
                    mode: deterministic
                    status: ready
                    createdAt: '2026-10-20T08:05:00Z'
                    pageCountBefore: 2
                    pageCountAfter: 1
                    suggestions:
                      - { id: s1, nodeId: n-exp-1-b2, kind: exclude, reason: Lowest relevance to this posting (score 0.0), score: 0.0, beforeLatex: null, afterLatex: null }
                      - { id: s2, nodeId: n-exp-1-b1, kind: reword, reason: Shortened to save a line, score: 0.8, beforeLatex: '\resumeItem{Cut batch runtime by 40\% with caching in a nightly job.}', afterLatex: '\resumeItem{Cut batch runtime by 40\% with caching.}' }
                    error: null
                failed:
                  value:
                    id: 8
                    draftId: 21
                    baseVersion: 3
                    mode: deterministic
                    status: failed
                    createdAt: '2026-10-20T08:06:00Z'
                    pageCountBefore: 3
                    pageCountAfter: null
                    suggestions: []
                    error: { code: cannot_fit, message: The mandatory content alone is longer than one page }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
  /api/drafts/{draftId}/cutdowns/{runId}/apply:
    post:
      tags: [cutdown]
      operationId: applyCutdown
      summary: Accept some or all suggestions of a ready run
      description: |
        Applies exactly the suggestions listed in `acceptedSuggestionIds`; the rest are rejected. The server first
        records the current content as a draft version (`reason: before_cutdown`) and then saves the result as a new
        version (`reason: cutdown_applied`), so the whole step is undone with `restoreDraftVersion`. Requires the run to
        be `ready` (else 409 `cutdown_not_ready`) and the draft still at the run's `baseVersion` (else 409
        `version_conflict`). An unknown suggestion id is 400. The result of applying (rewordings and exclusions) goes through the same validation as a
        draft save (tags, `{{children}}` rules, `latex` length, node ids): if it fails, nothing is applied and the answer is
        400 `validation_failed` with `details` naming the suggestion id (`field`). Applying marks the run `applied`; applying twice is 409
        `cutdown_not_ready`. An empty list applies nothing and discards the run (the draft is unchanged, 200).
      parameters:
        - { $ref: '#/components/parameters/XsrfToken' }
        - { $ref: '#/components/parameters/DraftId' }
        - { $ref: '#/components/parameters/RunId' }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ApplyCutdownRequest' }
            example: { acceptedSuggestionIds: [s1, s2] }
      responses:
        '200':
          description: The draft after applying
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Draft' }
              examples:
                current: { $ref: '#/components/examples/Draft' }
        '400': { $ref: '#/components/responses/ValidationError' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/CsrfInvalid' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409':
          description: Stale draft (`version_conflict`) or the run is not `ready` (`cutdown_not_ready`)
          content:
            application/json:
              schema:
                anyOf:
                  - { $ref: '#/components/schemas/VersionConflictError' }
                  - { $ref: '#/components/schemas/Error' }
              examples:
                stale: { value: { code: version_conflict, message: The resume changed since you loaded it, currentVersion: 4 } }
                notReady: { value: { code: cutdown_not_ready, message: This cutdown cannot be applied } }
components:
  securitySchemes:
    sessionCookie:
      type: apiKey
      in: cookie
      name: SESSION
    ingestToken:
      type: http
      scheme: bearer
      description: An ingest-only token (see `createIngestToken`); accepted only where an operation lists it.
  parameters:
    XsrfToken:
      name: X-XSRF-TOKEN
      in: header
      required: true
      description: The value of the `XSRF-TOKEN` cookie (see "CSRF protection" in the API description).
      schema: { type: string }
      example: 3f6c0b52-8a1d-4c57-9e2b-5d1a7c4e9f10
    TagSlug:
      name: slug
      in: path
      required: true
      description: The tag's canonical slug; a value that is not a slug is 404.
      schema: { type: string, pattern: '^[a-z0-9]+(-[a-z0-9]+)*$' }
      example: postgresql
    Version:
      name: version
      in: path
      required: true
      schema: { type: integer, minimum: 1 }
      example: 2
    SourceId:
      name: sourceId
      in: path
      required: true
      schema: { type: integer, format: int64 }
      example: 3
    JobId:
      name: jobId
      in: path
      required: true
      schema: { type: integer, format: int64 }
      example: 140
    DraftId:
      name: draftId
      in: path
      required: true
      schema: { type: integer, format: int64 }
      example: 21
    RunId:
      name: runId
      in: path
      required: true
      schema: { type: integer, format: int64 }
      example: 7
  responses:
    CsrfInvalid:
      description: Missing or wrong `X-XSRF-TOKEN` header
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
          example: { code: csrf_invalid, message: Missing or invalid CSRF token }
    Unauthorized:
      description: Not signed in
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
          example: { code: unauthorized, message: Sign in required }
    NotFound:
      description: Not found
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
          example: { code: not_found, message: Not found }
    ValidationError:
      description: Request failed validation
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
          example:
            code: validation_failed
            message: Request failed validation
            details:
              - { field: username, message: must be 3 to 40 characters }
    VersionConflict:
      description: Stale `baseVersion`; someone else saved first. Reload and retry.
      content:
        application/json:
          schema: { $ref: '#/components/schemas/VersionConflictError' }
          example:
            code: version_conflict
            message: The resume changed since you loaded it
            currentVersion: 4
