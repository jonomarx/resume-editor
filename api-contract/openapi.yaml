  schemas:
    Error:
      type: object
      required: [code, message]
      properties:
        code:
          type: string
          description: Stable machine-readable code (snake_case)
        message:
          type: string
          description: Human-readable text, safe to show
        details:
          type: array
          description: Per-field problems, present on validation_failed
          items:
            type: object
            required: [field, message]
            properties:
              field: { type: string }
              message: { type: string }
    VersionConflictError:
      allOf:
        - $ref: '#/components/schemas/Error'
        - type: object
          required: [currentVersion]
          properties:
            currentVersion:
              type: integer
              description: The version now stored; reload it before saving again
    SignUpRequest:
      description: Credentials for a new account (the sign-up password rules are on `password`).
      allOf:
        - $ref: '#/components/schemas/Credentials'
        - type: object
          properties:
            password:
              type: string
              minLength: 8
              maxLength: 72
              pattern: '^[^\u0000-\u001F\u007F]*$'
              format: password
              description: |
                At least 8 characters and at most 72 bytes in UTF-8 (the limit of the hashing algorithm), with no
                control characters (U+0000 to U+001F and U+007F). The byte count is authoritative, not the character
                count: exactly 72 bytes is accepted, 73 bytes is rejected, and a multi-byte character counts as 2 to 4
                bytes. A password breaking the byte limit or containing a control character is rejected with 400
                `validation_failed` on `password`; it is never truncated. The schema `maxLength: 72` and `pattern` are
                cheap first checks (72 characters can be up to 288 bytes). No Unicode normalization is applied: the
                password is hashed as the raw UTF-8 bytes as sent, so the same visible text in different normalization
                forms (for example precomposed and decomposed accented letters) is a different password.
    Credentials:
      type: object
      required: [username, password]
      properties:
        username:
          type: string
          pattern: '^[A-Za-z0-9_.-]{3,40}$'
          description: |
            3 to 40 characters: letters, digits, underscore, dot, hyphen. Unique case-insensitively
            ("Ada" and "ada" collide); a collision returns 409 `username_taken`.
        password:
          type: string
          minLength: 8
          format: password
          description: |
            The password. At sign-up the stricter rules of `SignUpRequest.password` apply. At login any text is accepted by
            the schema: a password longer than 72 bytes or containing a control character is simply a wrong password, the
            same 401 `bad_credentials` as any other (nothing special, never a 400, never truncated). No Unicode
            normalization is applied anywhere: the password is used as the raw UTF-8 bytes as sent.
    User:
      type: object
      required: [id, username]
      properties:
        id: { type: integer, format: int64 }
        username: { type: string }
    NodeType:
      type: string
      enum: [header, section, section_text, subsection, subsection_text, footer]
    ResumeNode:
      type: object
      description: |
        One node of the tree. Children are ordered. Subsections do not nest deeper than one level below a
        section. Tags are slugs from the shared vocabulary only.

        How a node becomes LaTeX
        - `latex` holds the node's own LaTeX in full: its heading or subheading macro (for example
          `\section{Experience}` or `\resumeSubheading{..}{..}{..}{..}`), any list wrapper macros, and the place
          where its child nodes go.
        - That place is the single token `{{children}}`, written inside `latex`. When the server assembles the
          document it replaces the token with the expanded LaTeX of the node's children, in `children` order, so
          reordering children never edits any `latex`.
        - A node with no children needs no token; a `{{children}}` token in a node without children is removed.
          A node that has children but no token is rejected with 400 `validation_failed` (`details` names the node
          id). No other `{{...}}` token exists; any other one is rejected the same way.
        - More than one `{{children}}` token in one node is also rejected the same way (`details` names the node id).
        - The token is literal and case-sensitive: `{{Children}}` is an unknown token. It is recognized anywhere in
          `latex`, including inside a LaTeX comment or verbatim text; such occurrences count like any other.
        - A section whose children mix text nodes and subsections expands them all, in `children` order, at the
          single token.
        - `title` is only the outline label; it is never written into the document.
        - The comment markers that map compile errors back to nodes are written by the assembler around each
          node's expanded output; they are not stored in `latex`.
        - The locked preamble and macro definitions are a hidden part of the server's template. They are never part
          of the tree and no API ever returns them.
      required: [id, type, title, latex, tags, children]
      properties:
        id:
          type: string
          description: Stable client-generated id, unique within the tree; used in render error mapping
          minLength: 1
          maxLength: 64
        type: { $ref: '#/components/schemas/NodeType' }
        title: { type: string, maxLength: 200 }
        latex:
          type: string
          maxLength: 20000
          description: The node's own LaTeX in full, including the single `{{children}}` token where its children go (see the schema description).
        tags:
          type: array
          items: { type: string, description: Tag slug }
        children:
          type: array
          description: Ordered child nodes, expanded where `{{children}}` appears in `latex`.
          items: { $ref: '#/components/schemas/ResumeNode' }
    ResumeTree:
      type: object
      description: Header and footer are separate top-level nodes; sections are ordered.
      required: [id, header, sections, footer]
      properties:
        id: { type: string }
        header: { $ref: '#/components/schemas/ResumeNode' }
        sections:
          type: array
          items: { $ref: '#/components/schemas/ResumeNode' }
        footer: { $ref: '#/components/schemas/ResumeNode' }
    ResumeDocument:
      type: object
      required: [id, version, contentHash, updatedAt, tree]
      properties:
        id: { type: integer, format: int64 }
        version: { type: integer, minimum: 1 }
        contentHash:
          type: string
          description: &hashdesc |
            SHA-256 (64 hex characters) of the canonical tree. `RenderResult.contentHash` uses the same method,
            so the same tree always yields the same hash in both places.
        updatedAt: { type: string, format: date-time }
        tree: { $ref: '#/components/schemas/ResumeTree' }
    SaveResumeRequest:
      type: object
      required: [baseVersion, tree]
      properties:
        baseVersion:
          type: integer
          minimum: 1
          description: The version this edit was based on
        tree: { $ref: '#/components/schemas/ResumeTree' }
    RestoreRequest:
      type: object
      required: [baseVersion]
      properties:
        baseVersion:
          type: integer
          minimum: 1
          description: The current version the caller last saw
    ResumeVersionSummary:
      type: object
      required: [version, contentHash, createdAt]
      properties:
        version: { type: integer, minimum: 1 }
        contentHash: { type: string, description: 'SHA-256 of the canonical tree (64 hex characters)' }
        createdAt: { type: string, format: date-time }
    TagCategory:
      type: string
      enum: [language, framework, domain, role_type]
    Tag:
      type: object
      required: [id, name, slug, category, aliases]
      properties:
        id: { type: integer, format: int64 }
        name: { type: string }
        slug: { type: string }
        category: { $ref: '#/components/schemas/TagCategory' }
        aliases:
          type: array
          items: { type: string }
          description: Aliases as typed (printable ASCII, any case); unique per user by lower-cased trimmed key.
    AliasConflictError:
      allOf:
        - $ref: '#/components/schemas/Error'
        - type: object
          required: [conflictingSlug]
          properties:
            conflictingSlug:
              type: string
              description: The canonical slug of the tag that already holds the alias key as its slug or as one of its alias keys
    AddAliasRequest:
      type: object
      required: [alias]
      properties:
        alias:
          type: string
          pattern: '^[ -~]+$'
          description: |
            Printable ASCII (space to tilde). After trimming leading and trailing spaces it must be 1 to 60 characters
            (a length rule the schema cannot express); stored as typed.
    CreateTagRequest:
      type: object
      required: [name, category]
      properties:
        name: { type: string, minLength: 1, maxLength: 60 }
        category: { $ref: '#/components/schemas/TagCategory' }
    RenderRequest:
      type: object
      required: [tree]
      properties:
        tree: { $ref: '#/components/schemas/ResumeTree' }
    RenderError:
      type: object
      required: [message]
      properties:
        nodeId:
          type: string
          nullable: true
          description: Node whose LaTeX caused the error, or null if it is in the preamble
        line:
          type: integer
          nullable: true
          description: Line within the node's LaTeX
        message: { type: string }
    RenderResult:
      type: object
      required: [success, contentHash, cached, pageCount, pdfUrl, log, errors]
      properties:
        success: { type: boolean }
        contentHash:
          type: string
          description: *hashdesc
        cached: { type: boolean, description: True when served from the render cache }
        pageCount: { type: integer, nullable: true }
        pdfUrl: { type: string, nullable: true }
        log: { type: string, description: Compile log (may be truncated) }
        errors:
          type: array
          items: { $ref: '#/components/schemas/RenderError' }
    ExtractionTier:
      type: string
      nullable: true
      enum: [ats_feed, json_ld, llm, null]
      description: How the source's postings were last extracted; null before the first crawl.
    Source:
      type: object
      required: [id, name, url, enabled, extractionTier, createdAt, lastCrawlAt]
      properties:
        id: { type: integer, format: int64 }
        name: { type: string }
        url: { type: string, description: The normalized career page URL }
        enabled: { type: boolean }
        extractionTier: { $ref: '#/components/schemas/ExtractionTier' }
        createdAt: { type: string, format: date-time }
        lastCrawlAt: { type: string, format: date-time, nullable: true }
    CreateSourceRequest:
      type: object
      required: [url]
      properties:
        url: { type: string, maxLength: 2000, pattern: '^https?://\S+$', description: 'Absolute http or https URL of a public host (see `createSource` for the normalization and the SSRF rules)' }
        name: { type: string, minLength: 1, maxLength: 100, description: Defaults to the URL's host }
    UpdateSourceRequest:
      type: object
      description: Fields left out are unchanged.
      properties:
        name: { type: string, minLength: 1, maxLength: 100 }
        enabled: { type: boolean }
    SourceExistsError:
      allOf:
        - $ref: '#/components/schemas/Error'
        - type: object
          required: [existingSourceId]
          properties:
            existingSourceId: { type: integer, format: int64 }
    CrawlRun:
      type: object
      required: [id, startedAt, finishedAt, status, postingsSeen, added, updated, closed, error]
      properties:
        id: { type: integer, format: int64 }
        startedAt: { type: string, format: date-time }
        finishedAt: { type: string, format: date-time, nullable: true }
        status: { type: string, enum: [running, succeeded, failed, skipped_unchanged] }
        postingsSeen: { type: integer, minimum: 0 }
        added: { type: integer, minimum: 0 }
        updated: { type: integer, minimum: 0 }
        closed: { type: integer, minimum: 0, description: Postings that became stale or closed in this run }
        error: { type: string, nullable: true, description: Short reason when `status` is `failed` }
    SourceHealth:
      type: object
      required: [source, state, consecutiveFailures, activePostings, stalePostings, lastRun, recentRuns]
      properties:
        source: { $ref: '#/components/schemas/Source' }
        state:
          type: string
          enum: [never_run, healthy, degraded, failing]
          description: '`degraded` is one failed run, `failing` is two or more in a row.'
        consecutiveFailures: { type: integer, minimum: 0 }
        activePostings: { type: integer, minimum: 0 }
        stalePostings: { type: integer, minimum: 0 }
        lastRun: { type: object, allOf: [ { $ref: '#/components/schemas/CrawlRun' } ], nullable: true }
        recentRuns:
          type: array
          description: The last 10 runs, newest first
          items: { $ref: '#/components/schemas/CrawlRun' }
    IngestToken:
      type: object
      required: [id, label, createdAt, lastUsedAt, revokedAt]
      properties:
        id: { type: integer, format: int64 }
        label: { type: string }
        createdAt: { type: string, format: date-time }
        lastUsedAt: { type: string, format: date-time, nullable: true }
        revokedAt: { type: string, format: date-time, nullable: true }
    CreatedIngestToken:
      allOf:
        - $ref: '#/components/schemas/IngestToken'
        - type: object
          required: [token]
          properties:
            token: { type: string, description: The secret; shown only in this response }
    CreateIngestTokenRequest:
      type: object
      required: [label]
      properties:
        label: { type: string, minLength: 1, maxLength: 60 }
    IngestRequest:
      type: object
      required: [kind, payload]
      properties:
        kind: { type: string, enum: [url, html, text, email] }
        payload:
          type: string
          minLength: 1
          maxLength: 1000000
          description: A URL for `url`; the content otherwise. Larger payloads are 413.
        sourceHint: { type: string, nullable: true, maxLength: 500 }
    IngestAccepted:
      type: object
      required: [ingestEventId, status, duplicate]
      properties:
        ingestEventId: { type: integer, format: int64 }
        status: { $ref: '#/components/schemas/IngestStatus' }
        duplicate: { type: boolean, description: True when an earlier request for the same URL or content already exists }
    IngestStatus:
      type: string
      enum: [queued, processing, done, failed]
    IngestEvent:
      type: object
      required: [id, kind, status, receivedAt, finishedAt, jobId, error]
      properties:
        id: { type: integer, format: int64 }
        kind: { type: string, enum: [url, html, text, email] }
        status: { $ref: '#/components/schemas/IngestStatus' }
        receivedAt: { type: string, format: date-time }
        finishedAt: { type: string, format: date-time, nullable: true }
        jobId: { type: integer, format: int64, nullable: true, description: 'The posting created or matched, once `done`' }
        error:
          type: object
          nullable: true
          description: Present when `status` is `failed`
          required: [code, message]
          properties:
            code: { type: string }
            message: { type: string }
    Capabilities:
      type: object
      required: [llmAvailable]
      properties:
        llmAvailable: { type: boolean, description: False when no LLM provider is configured }
    JobUserStatus:
      type: string
      enum: [new, saved, dismissed, applied]
    PostingStatus:
      type: string
      enum: [active, stale, closed]
    JobSummary:
      type: object
      required: [id, title, company, location, url, description, basicRequirements, preferredRequirements, tags, fitScore, userStatus, postingStatus, origin, sourceId, draftId, postedAt, firstSeenAt, lastSeenAt]
      properties:
        id: { type: integer, format: int64 }
        title: { type: string }
        company: { type: string }
        location: { type: string, nullable: true }
        url: { type: string, description: The posting's canonical URL }
        description: { type: string, description: A brief description (at most 500 characters) }
        basicRequirements: { type: array, items: { type: string } }
        preferredRequirements: { type: array, items: { type: string } }
        tags: { type: array, items: { type: string, description: Tag slug } }
        fitScore:
          type: integer
          minimum: 0
          maximum: 100
          description: How well the master resume fits the posting, computed per request (0 when the master has no tags)
        userStatus: { $ref: '#/components/schemas/JobUserStatus' }
        postingStatus: { $ref: '#/components/schemas/PostingStatus' }
        origin: { type: string, enum: [crawl, ingest] }
        sourceId: { type: integer, format: int64, nullable: true }
        draftId: { type: integer, format: int64, nullable: true, description: 'The user''s draft for this posting, if any' }
        postedAt: { type: string, format: date-time, nullable: true }
        firstSeenAt: { type: string, format: date-time }
        lastSeenAt: { type: string, format: date-time }
    Eligibility:
      type: object
      required: [season, workAuthorization, classYear]
      description: Hard-filter fields extracted from the posting; null when the posting does not say.
      properties:
        season: { type: string, nullable: true }
        workAuthorization: { type: string, nullable: true }
        classYear: { type: string, nullable: true }
    JobDetail:
      allOf:
        - $ref: '#/components/schemas/JobSummary'
        - type: object
          required: [fullDescription, eligibility, fit]
          properties:
            fullDescription: { type: string }
            eligibility: { $ref: '#/components/schemas/Eligibility' }
            fit:
              type: object
              required: [matchedTags, missingTags]
              description: Why the score is what it is
              properties:
                matchedTags: { type: array, items: { type: string }, description: Posting tags the master resume also has }
                missingTags: { type: array, items: { type: string }, description: Posting tags the master resume lacks }
    JobPage:
      type: object
      required: [items, total, limit, offset]
      properties:
        items: { type: array, items: { $ref: '#/components/schemas/JobSummary' } }
        total: { type: integer, minimum: 0, description: 'Postings matching the filters, ignoring paging' }
        limit: { type: integer }
        offset: { type: integer }
    SetJobStatusRequest:
      type: object
      required: [status]
      properties:
        status: { $ref: '#/components/schemas/JobUserStatus' }
    DraftStatus:
      type: string
      enum: [in_progress, ready, applied]
    Draft:
      type: object
      required: [id, jobId, status, version, contentHash, createdAt, updatedAt, excludedNodeIds, tree]
      properties:
        id: { type: integer, format: int64 }
        jobId: { type: integer, format: int64 }
        status: { $ref: '#/components/schemas/DraftStatus' }
        version: { type: integer, minimum: 1 }
        contentHash:
          type: string
          description: Hash of the canonical tree and the sorted `excludedNodeIds`
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
        excludedNodeIds:
          type: array
          items: { type: string }
          description: 'Include toggles that are off: the listed nodes and their subtrees are pruned from the tree before it is rendered, exported or cut down. Clients prune the same way before calling `POST /api/render` (see `saveDraft`).'
        tree: { $ref: '#/components/schemas/ResumeTree' }
    DraftSummary:
      type: object
      required: [id, jobId, jobTitle, company, status, version, updatedAt]
      properties:
        id: { type: integer, format: int64 }
        jobId: { type: integer, format: int64 }
        jobTitle: { type: string }
        company: { type: string }
        status: { $ref: '#/components/schemas/DraftStatus' }
        version: { type: integer, minimum: 1 }
        updatedAt: { type: string, format: date-time }
    SaveDraftRequest:
      type: object
      required: [baseVersion, tree, excludedNodeIds]
      properties:
        baseVersion: { type: integer, minimum: 1 }
        tree: { $ref: '#/components/schemas/ResumeTree' }
        excludedNodeIds: { type: array, items: { type: string } }
        status: { $ref: '#/components/schemas/DraftStatus' }
    DraftVersionSummary:
      type: object
      required: [version, contentHash, createdAt, reason]
      properties:
        version: { type: integer, minimum: 1 }
        contentHash: { type: string }
        createdAt: { type: string, format: date-time }
        reason:
          type: string
          enum: [fork, save, restore, before_cutdown, cutdown_applied]
    StartCutdownRequest:
      type: object
      required: [baseVersion]
      properties:
        baseVersion: { type: integer, minimum: 1 }
        mode: { type: string, enum: [deterministic, llm_tighten], default: deterministic }
    CutdownSuggestion:
      type: object
      required: [id, nodeId, kind, reason, score, beforeLatex, afterLatex]
      properties:
        id: { type: string, description: Unique within the run }
        nodeId: { type: string }
        kind:
          type: string
          enum: [exclude, reword]
          description: '`exclude` turns the node''s include toggle off; `reword` replaces its `latex`.'
        reason: { type: string, description: 'Human-readable, safe to show' }
        score: { type: number, nullable: true, description: The node's relevance to the posting (0 to 1) }
        beforeLatex: { type: string, nullable: true, description: The node's latex now (`reword` only) }
        afterLatex: { type: string, nullable: true, maxLength: 20000, description: 'The proposed latex (`reword` only); LLM-written, so untrusted: it is never executed and is validated on apply' }
    CutdownRun:
      type: object
      required: [id, draftId, baseVersion, mode, status, createdAt, pageCountBefore, pageCountAfter, suggestions, error]
      properties:
        id: { type: integer, format: int64 }
        draftId: { type: integer, format: int64 }
        baseVersion: { type: integer, minimum: 1 }
        mode: { type: string, enum: [deterministic, llm_tighten] }
        status: { type: string, enum: [queued, running, ready, failed, applied, discarded] }
        createdAt: { type: string, format: date-time }
        pageCountBefore: { type: integer, nullable: true }
        pageCountAfter:
          type: integer
          nullable: true
          description: Pages after the accepted suggestions are applied; exactly 1 when `status` is `ready`
        suggestions: { type: array, items: { $ref: '#/components/schemas/CutdownSuggestion' } }
        error:
          type: object
          nullable: true
          description: 'Present when `failed`: `cannot_fit` (the content that cannot be excluded is longer than one page), `renderer_unavailable`, `llm_unavailable`, `llm_budget_exceeded`, `timed_out` (see `startCutdown`)'
          required: [code, message]
          properties:
            code: { type: string }
            message: { type: string }
    ApplyCutdownRequest:
      type: object
      required: [acceptedSuggestionIds]
      properties:
        acceptedSuggestionIds: { type: array, items: { type: string } }
