openapi: 3.0.3
info:
  title: Resume Editor API
  version: 0.4.0
  description: |
    Contract v0 (US-003, fixes in US-076): auth, master resume, tags, render.
    Changed only through stories labeled `contract`.

    Conventions
    - All paths are under `/api`. JSON bodies use camelCase.
    - Authentication is a session cookie (`SESSION`, HttpOnly, SameSite=Lax) set by login or sign-up.
    - Every error response uses the `Error` schema.
    - Resume saves use optimistic locking: send the `baseVersion` you loaded; a stale save returns 409.

    CSRF protection
    - The server sets a JavaScript-readable `XSRF-TOKEN` cookie. `GET /api/me` always sets it, including its 401
      response, so a signed-out client can obtain a token before sign-up or login.
    - Every state-changing request (POST, PUT, DELETE, including sign-up, login and logout) must send the cookie's
      value in an `X-XSRF-TOKEN` header. A missing or wrong token returns 403 with code `csrf_invalid`.
    - The token may be replaced when a session starts; clients re-read the cookie before each request.
servers:
  - url: http://localhost:8080
    description: Local Spring Boot (the Vite dev server proxies /api to it)
tags:
  - name: auth
    description: Sign-up, login, logout, current user
  - name: resume
    description: Master resume read, write, versions, restore
  - name: tags
    description: Shared tag vocabulary
  - name: render
    description: LaTeX to PDF
security:
  - sessionCookie: []
paths:
  /api/auth/signup:
    post:
      tags: [auth]
      operationId: signUp
      summary: Create an account and start a session
      security: []
      parameters:
        - { $ref: '#/components/parameters/XsrfToken' }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/Credentials' }
            example: { username: ada, password: correct-horse-battery }
      responses:
        '403': { $ref: '#/components/responses/CsrfInvalid' }
        '201':
          description: Account created and signed in
          headers:
            Set-Cookie:
              description: Session cookie
              schema: { type: string }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/User' }
              example: { id: 1, username: ada }
        '400': { $ref: '#/components/responses/ValidationError' }
        '409':
          description: Username already taken
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
              example: { code: username_taken, message: That username is taken }
  /api/auth/login:
    post:
      tags: [auth]
      operationId: logIn
      summary: Start a session
      security: []
      parameters:
        - { $ref: '#/components/parameters/XsrfToken' }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/Credentials' }
            example: { username: ada, password: correct-horse-battery }
      responses:
        '403': { $ref: '#/components/responses/CsrfInvalid' }
        '200':
          description: Signed in
          headers:
            Set-Cookie:
              description: Session cookie
              schema: { type: string }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/User' }
              example: { id: 1, username: ada }
        '400': { $ref: '#/components/responses/ValidationError' }
        '401':
          description: Wrong username or password
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
              example: { code: bad_credentials, message: Invalid username or password }
  /api/auth/logout:
    post:
      tags: [auth]
      operationId: logOut
      summary: End the session
      parameters:
        - { $ref: '#/components/parameters/XsrfToken' }
      responses:
        '403': { $ref: '#/components/responses/CsrfInvalid' }
        '204': { description: Signed out }
        '401': { $ref: '#/components/responses/Unauthorized' }
  /api/me:
    get:
      tags: [auth]
      operationId: getMe
      summary: The signed-in user
      responses:
        '200':
          description: Current user
          headers:
            Set-Cookie:
              description: Refreshes the `XSRF-TOKEN` cookie (readable by JavaScript)
              schema: { type: string }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/User' }
              example: { id: 1, username: ada }
        '401':
          description: Not signed in (the response still sets the `XSRF-TOKEN` cookie)
          headers:
            Set-Cookie:
              description: Sets the `XSRF-TOKEN` cookie (readable by JavaScript)
              schema: { type: string }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
              example: { code: unauthorized, message: Sign in required }
  /api/resumes/master:
    get:
      tags: [resume]
      operationId: getMasterResume
      summary: Read the latest version of the master resume
      description: The first read creates the master from the Jake-template starter tree.
      responses:
        '200':
          description: Latest version
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ResumeDocument' }
              examples:
                current: { $ref: '#/components/examples/ResumeDocument' }
        '401': { $ref: '#/components/responses/Unauthorized' }
    put:
      tags: [resume]
      operationId: saveMasterResume
      summary: Save a new version of the master resume
      description: |
        Succeeds only if `baseVersion` equals the current version; the new version is `baseVersion + 1`.
        A stale `baseVersion` returns 409 with the current version so the UI can offer a reload.

        A save whose tree is identical to the current version (same `contentHash`) does not create a version: it
        returns the current document unchanged with 200.

        Tags on nodes must be slugs in the tag vocabulary. A tree containing any unknown slug is rejected with 400,
        code `validation_failed`, and `details` has one entry per offending slug (`field` is the slug's node id
        path, `message` names the slug).

        Node LaTeX follows the `{{children}}` rules in the `ResumeNode` schema: a node with children but no token,
        or any other `{{...}}` token, is rejected with 400 `validation_failed` and `details` naming the node id.
      parameters:
        - { $ref: '#/components/parameters/XsrfToken' }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/SaveResumeRequest' }
            examples:
              save: { $ref: '#/components/examples/SaveRequest' }
      responses:
        '403': { $ref: '#/components/responses/CsrfInvalid' }
        '200':
          description: Saved
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ResumeDocument' }
              examples:
                current: { $ref: '#/components/examples/ResumeDocument' }
        '400':
          description: Request failed validation, including tags that are not in the vocabulary
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
              examples:
                unknownTag:
                  summary: A tag slug that is not in the vocabulary
                  value:
                    code: validation_failed
                    message: Request failed validation
                    details:
                      - { field: n-exp-1-b1, message: unknown tag slug "javscript" }
                missingChildrenToken:
                  summary: A node with children whose latex has no {{children}} token
                  value:
                    code: validation_failed
                    message: Request failed validation
                    details:
                      - { field: n-exp-1, message: 'node has children but its latex has no {{children}} token' }
                duplicateChildrenToken:
                  summary: More than one {{children}} token in one node
                  value:
                    code: validation_failed
                    message: Request failed validation
                    details:
                      - { field: n-exp, message: 'node latex has more than one {{children}} token' }
                unknownToken:
                  summary: A {{...}} token other than {{children}}
                  value:
                    code: validation_failed
                    message: Request failed validation
                    details:
                      - { field: n-exp, message: 'unknown token {{items}} (the only token is {{children}})' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '409': { $ref: '#/components/responses/VersionConflict' }
  /api/resumes/master/versions:
    get:
      tags: [resume]
      operationId: listMasterVersions
      summary: Version history, newest first
      responses:
        '200':
          description: Versions
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/ResumeVersionSummary' }
              example:
                - { version: 3, contentHash: e99551fa57d7a6c2858733580847871fae001b49e0f54e59dc8e15ebae6b5203, createdAt: '2026-10-18T20:15:00Z' }
                - { version: 2, contentHash: b10af658e08210683091e16185d3c41ddcae75ca55322e125094137dd668097e, createdAt: '2026-10-18T19:02:00Z' }
        '401': { $ref: '#/components/responses/Unauthorized' }
  /api/resumes/master/versions/{version}:
    get:
      tags: [resume]
      operationId: getMasterVersion
      summary: Read one historical version
      parameters:
        - { $ref: '#/components/parameters/Version' }
      responses:
        '200':
          description: That version
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ResumeDocument' }
              examples:
                current: { $ref: '#/components/examples/ResumeDocument' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
  /api/resumes/master/versions/{version}/restore:
    post:
      tags: [resume]
      operationId: restoreMasterVersion
      summary: Make an old version the newest version
      description: |
        Copies the old content into a new version (history is never rewritten).
        Uses the same optimistic check as a save.
        A missing or invalid `baseVersion` returns 400.
        If the stored tree of that version violates today's node rules (for example the `{{children}}` rules of the
        `ResumeNode` schema), restore is rejected with the same 400 `validation_failed` as a save. No such stored data
        exists yet.
      parameters:
        - { $ref: '#/components/parameters/XsrfToken' }
        - { $ref: '#/components/parameters/Version' }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/RestoreRequest' }
            example: { baseVersion: 3 }
      responses:
        '403': { $ref: '#/components/responses/CsrfInvalid' }
        '200':
          description: Restored as a new version
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ResumeDocument' }
              examples:
                current: { $ref: '#/components/examples/ResumeDocument' }
        '400': { $ref: '#/components/responses/ValidationError' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/VersionConflict' }
  /api/tags:
    get:
      tags: [tags]
      operationId: listTags
      summary: The tag vocabulary
      parameters:
        - name: category
          in: query
          schema: { $ref: '#/components/schemas/TagCategory' }
        - name: q
          in: query
          description: Case-insensitive substring match on name, slug or alias key (the lower-cased trimmed alias)
          schema: { type: string }
      responses:
        '200':
          description: Tags
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/Tag' }
              example:
                - { id: 7, name: Java, slug: java, category: language, aliases: [Java 17, JDK] }
                - { id: 8, name: React, slug: react, category: framework, aliases: [React.js] }
                - { id: 10, name: C++, slug: c-plus-plus, category: language, aliases: [CPP, 'C++'] }
        '401': { $ref: '#/components/responses/Unauthorized' }
    post:
      tags: [tags]
      operationId: createTag
      summary: Get or create a vocabulary entry
      description: |
        Slug normalization, in this order: trim, Unicode NFKC, lowercase, replace every `+` with `-plus-` and every `#`
        with `-sharp-`, collapse every run of characters outside `[a-z0-9]` into one hyphen, strip leading and trailing
        hyphens. So "C" is `c`, "C++" is `c-plus-plus`, "C#" is `c-sharp`, "Node.js" is `node-js`. Non-ASCII letters are
        not transliterated: they are separators ("café" gives `caf`). A name with no letter or digit and no `+` or `#`
        is rejected with 400 `validation_failed`.

        Resolution order: (1) the trimmed, lower-cased name is compared with every alias key of the user (an alias key
        is the trimmed, lower-cased alias); (2) the computed slug is compared with the user's tag slugs and with their
        alias keys. The first match is returned with 200 (its category and name are kept); if nothing matches a new tag
        is created with 201. Example: posting "C++" returns the tag that has the alias "C++" if there is one, otherwise
        creates `c-plus-plus`.
      parameters:
        - { $ref: '#/components/parameters/XsrfToken' }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CreateTagRequest' }
            examples:
              postgres: { value: { name: PostgreSQL, category: language } }
              cpp: { value: { name: 'C++', category: language } }
              csharp: { value: { name: 'C#', category: language } }
      responses:
        '403': { $ref: '#/components/responses/CsrfInvalid' }
        '200':
          description: Already existed (the name matched an alias key, a slug or a slug equal to an alias key)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Tag' }
              examples:
                postgres: { value: { id: 9, name: PostgreSQL, slug: postgresql, category: language, aliases: [Postgres] } }
                cpp: { value: { id: 10, name: C++, slug: c-plus-plus, category: language, aliases: ['C++', CPP] } }
        '201':
          description: Created
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Tag' }
              examples:
                postgres: { value: { id: 9, name: PostgreSQL, slug: postgresql, category: language, aliases: [] } }
                cpp: { value: { id: 10, name: C++, slug: c-plus-plus, category: language, aliases: [] } }
                csharp: { value: { id: 11, name: C#, slug: c-sharp, category: language, aliases: [] } }
        '400': { $ref: '#/components/responses/ValidationError' }
        '401': { $ref: '#/components/responses/Unauthorized' }
  /api/tags/{slug}/aliases:
    post:
      tags: [tags]
      operationId: addTagAlias
      summary: Add an alias to a tag
      description: |
        An alias is any printable ASCII text (0x20 to 0x7E): "C++", "C#", ".NET" and "Node.js" are valid aliases. After
        trimming leading and trailing spaces it must be 1 to 60 characters; anything else (control characters, non-ASCII
        characters such as "café", an empty value) is rejected with 400 `validation_failed`. The alias is stored exactly
        as typed after trimming (leading and trailing spaces are removed when it is stored; internal spaces and case are
        kept) and shown that way in `Tag.aliases`.

        Comparison uses the alias key: the trimmed alias lower-cased. Aliases are unique per user by alias key, so "C++"
        and "c++" are the same alias. An alias is a conflict when its key equals another tag's alias key or another tag's
        slug; that is rejected with 409 `alias_conflict`. Clients must not parse the free-text `message`; use
        `conflictingSlug`.

        Adding an alias whose key equals one the tag already has, or equals the tag's own slug, is a no-op: 200 with the
        unchanged canonical Tag. The canonical slug never changes through these operations. There is no cap on the
        number of aliases per tag.

        Afterwards `POST /api/tags` and `GET /api/tags?q=` resolve the alias to this tag (200, existing).

        Adding or removing an alias never changes the tags on any resume node (nodes reference tags by slug).
      parameters:
        - { $ref: '#/components/parameters/XsrfToken' }
        - { $ref: '#/components/parameters/TagSlug' }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/AddAliasRequest' }
            examples:
              plain: { value: { alias: Postgres } }
              cpp: { value: { alias: 'C++' } }
              dotnet: { value: { alias: .NET } }
      responses:
        '200':
          description: The updated tag
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Tag' }
              examples:
                plain: { value: { id: 9, name: PostgreSQL, slug: postgresql, category: language, aliases: [Postgres] } }
                cpp: { value: { id: 10, name: C++, slug: c-plus-plus, category: language, aliases: ['C++'] } }
        '400':
          description: The alias is empty, longer than 60 characters, or not printable ASCII
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
              examples:
                nonAscii:
                  summary: Non-ASCII character
                  value:
                    code: validation_failed
                    message: Request failed validation
                    details:
                      - { field: alias, message: must be printable ASCII (space to tilde) }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/CsrfInvalid' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409':
          description: The alias key equals another tag's alias key or slug
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AliasConflictError' }
              examples:
                conflict:
                  summary: Case-insensitive collision ("MYSQL" or "mysql" against tag mysql)
                  value: { code: alias_conflict, message: That alias already belongs to another tag, conflictingSlug: mysql }
                aliasEqualsOtherSlug:
                  summary: Adding the alias "C" to tag c-plus-plus (its alias key `c` equals the slug of tag c)
                  value: { code: alias_conflict, message: That alias already belongs to another tag, conflictingSlug: c }
    delete:
      tags: [tags]
      operationId: removeTagAlias
      summary: Remove an alias from a tag
      description: |
        The alias goes in the `alias` query parameter, percent-encoded (aliases can contain `/`, `.`, `%`, `#` and
        spaces, which do not belong in a path segment: "C++" is `?alias=C%2B%2B`). It is matched by alias key, so the
        case of the value does not matter. Removing an alias the tag does not have returns 404, as does an unknown tag
        or a `{slug}` that is not a valid slug. The tag's slug itself is not an alias and cannot be removed here. The
        canonical slug never changes through this operation, and removing an alias never changes the tags on any
        resume node.

        Encoding: a space in the `alias` value is `%20` (not `+`), and a literal `+` is `%2B`. An alias that is too
        long or not printable ASCII can never be stored, so it simply matches nothing and returns 404.
      parameters:
        - { $ref: '#/components/parameters/XsrfToken' }
        - { $ref: '#/components/parameters/TagSlug' }
        - name: alias
          in: query
          required: true
          description: The alias to remove, percent-encoded; matched by alias key (trimmed, lower-cased).
          schema: { type: string }
          example: C++
      responses:
        '200':
          description: The updated tag
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Tag' }
              example: { id: 10, name: C++, slug: c-plus-plus, category: language, aliases: [] }
        '400':
          description: The `alias` query parameter is missing
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
              example:
                code: validation_failed
                message: Request failed validation
                details:
                  - { field: alias, message: is required }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/CsrfInvalid' }
        '404': { $ref: '#/components/responses/NotFound' }
  /api/render:
    post:
      tags: [render]
      operationId: renderResume
      summary: Compile a resume tree to PDF
      description: |
        The server assembles the tree into a LaTeX document (locked preamble, header, sections, footer),
        compiles it in the sandboxed renderer, and caches the result by content hash. The same tree always
        returns the same `contentHash`. A LaTeX compile failure is a normal 200 response with `success: false`
        and errors mapped to node ids; fetch the PDF of a successful render from `pdfUrl`.
      parameters:
        - { $ref: '#/components/parameters/XsrfToken' }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/RenderRequest' }
            examples:
              render: { $ref: '#/components/examples/RenderRequest' }
      responses:
        '403': { $ref: '#/components/responses/CsrfInvalid' }
        '200':
          description: Render finished (check `success`)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/RenderResult' }
              examples:
                ok:
                  summary: Compiled
                  value:
                    success: true
                    contentHash: b706a01cf5720a0f5e9044150a32728b0773bfd2a065bfa7704fb9ae91038f82
                    cached: false
                    pageCount: 1
                    pdfUrl: /api/render/b706a01cf5720a0f5e9044150a32728b0773bfd2a065bfa7704fb9ae91038f82/pdf
                    log: This is pdfTeX, Version 3.141592653
                    errors: []
                failed:
                  summary: Compile error in a node
                  value:
                    success: false
                    contentHash: b6630edd4acc65e3c44874f48d0f80e3fe629905b7aad7ca669f149162451d63
                    cached: false
                    pageCount: null
                    pdfUrl: null
                    log: '! Undefined control sequence.'
                    errors:
                      - { nodeId: n-exp-1, line: 2, message: Undefined control sequence }
        '400': { $ref: '#/components/responses/ValidationError' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '413':
          description: Document too large
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
              example: { code: too_large, message: Resume is too large to render }
        '429':
          description: Too many render requests
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
              example: { code: rate_limited, message: Slow down and try again shortly }
        '503':
          description: Renderer unavailable or timed out
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
              example: { code: renderer_unavailable, message: The renderer did not respond in time }
  /api/render/{contentHash}/pdf:
    get:
      tags: [render]
      operationId: getRenderedPdf
      summary: The PDF of a successful render
      description: |
        `contentHash` is the full SHA-256 (64 hex characters) from a render result. The server checks that the PDF
        belongs to the signed-in user; any other hash, including someone else's, returns 404 (never 403).
      parameters:
        - name: contentHash
          in: path
          required: true
          schema: { type: string, pattern: '^[0-9a-f]{64}$' }
          example: b706a01cf5720a0f5e9044150a32728b0773bfd2a065bfa7704fb9ae91038f82
      responses:
        '200':
          description: PDF bytes (immutable, cacheable)
          content:
            application/pdf:
              schema: { type: string, format: binary }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
components:
  securitySchemes:
    sessionCookie:
      type: apiKey
      in: cookie
      name: SESSION
  parameters:
    XsrfToken:
      name: X-XSRF-TOKEN
      in: header
      required: true
      description: The value of the `XSRF-TOKEN` cookie (see "CSRF protection" in the API description).
      schema: { type: string }
      example: 3f6c0b52-8a1d-4c57-9e2b-5d1a7c4e9f10
    TagSlug:
      name: slug
      in: path
      required: true
      description: The tag's canonical slug; a value that is not a slug is 404.
      schema: { type: string, pattern: '^[a-z0-9]+(-[a-z0-9]+)*$' }
      example: postgresql
    Version:
      name: version
      in: path
      required: true
      schema: { type: integer, minimum: 1 }
      example: 2
  responses:
    CsrfInvalid:
      description: Missing or wrong `X-XSRF-TOKEN` header
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
          example: { code: csrf_invalid, message: Missing or invalid CSRF token }
    Unauthorized:
      description: Not signed in
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
          example: { code: unauthorized, message: Sign in required }
    NotFound:
      description: Not found
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
          example: { code: not_found, message: Not found }
    ValidationError:
      description: Request failed validation
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
          example:
            code: validation_failed
            message: Request failed validation
            details:
              - { field: username, message: must be 3 to 40 characters }
    VersionConflict:
      description: Stale `baseVersion`; someone else saved first. Reload and retry.
      content:
        application/json:
          schema: { $ref: '#/components/schemas/VersionConflictError' }
          example:
            code: version_conflict
            message: The resume changed since you loaded it
            currentVersion: 4
  examples:
    SaveRequest:
      summary: Save after editing version 3
      value:
        baseVersion: 3
        tree:
          id: root
